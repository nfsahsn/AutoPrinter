{% extends 'base.html' %}
{% block extra_css %}
<style>
.cp-icon {
    width: 48px;
    height: 48px;
    background: var(--accent-gradient);
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 14px;
    font-size: 22px;
    box-shadow: 0 6px 20px rgba(59,130,246,0.2);
}
.cp-title {
    font-size: 18px;
    font-weight: 800;
    margin-bottom: 4px;
}
.cp-sub {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 20px;
}
</style>
{% endblock %}

{% block content %}
<div class="cardx text-center">
    <div class="cp-icon">🔑</div>
    <h2 class="cp-title">Change Password</h2>
    <p class="cp-sub">Update your admin password</p>

    {% if error %}
    <div class="alert-error">❌ {{ error }}</div>
    {% endif %}

    <form method="post" style="text-align:left;">
        <div class="form-group">
            <label class="form-label">Old Password</label>
            <input class="form-control" type="password" name="old_password" required placeholder="Current password">
        </div>
        <div class="form-group">
            <label class="form-label">New Password</label>
            <input class="form-control" type="password" name="new_password" required placeholder="Min 4 characters">
        </div>
        <div class="form-group">
            <label class="form-label">Confirm Password</label>
            <input class="form-control" type="password" name="confirm_password" required placeholder="Re-enter new password">
        </div>
        <button class="btn btn-primary w-full" type="submit">Update Password</button>
        <a class="btn btn-dark w-full mt-2" href="/admin">← Back to Panel</a>
    </form>
</div>
{% endblock %}
